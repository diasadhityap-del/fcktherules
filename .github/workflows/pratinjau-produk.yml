name: Pratinjau produk

# Membuat halaman /<nama-produk>/ berisi tag meta khusus produk (untuk kartu pratinjau link).
# Berjalan tiap 30 menit, bisa dijalankan manual (Actions > Pratinjau produk > Run workflow), dan saat skrip atau index.html berubah.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/pratinjau-produk.mjs'
      - 'index.html'

permissions:
  contents: write
  pages: write

concurrency:
  group: pratinjau-produk
  cancel-in-progress: false

jobs:
  buat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buat halaman pratinjau
        run: node tools/pratinjau-produk.mjs
      - name: Simpan jika ada perubahan
        id: simpan
        run: |
          git config user.name "pratinjau-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Tidak ada perubahan."; echo "berubah=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Pratinjau produk: perbarui halaman"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
          echo "berubah=1" >> "$GITHUB_OUTPUT"
      - name: Minta GitHub Pages membangun ulang
        if: steps.simpan.outputs.berubah == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages akan membangun sendiri."
